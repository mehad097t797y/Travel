/* IMAGE COMPRESS */

function compressImage(file){

return new Promise(resolve=>{

const reader=new FileReader();

reader.onload=e=>{

const img=new Image();

img.onload=()=>{

const canvas=document.createElement("canvas");

const max=900;

let w=img.width;
let h=img.height;

if(w>max){
h=h*max/w;
w=max;
}

if(h>max){
w=w*max/h;
h=max;
}

canvas.width=w;
canvas.height=h;

const ctx=canvas.getContext("2d");

ctx.drawImage(img,0,0,w,h);

resolve(
canvas.toDataURL("image/jpeg",0.75)
);

};

img.src=e.target.result;

};

reader.readAsDataURL(file);

});

}

await updateDoc(

name,
age,
image

);

{
name,
age,
image,
createdAt:

);

newDoc.id;

}


localStorage.setItem(
"travelProfile",
JSON.stringify(newProfile)

/* ADMIN MEMORY LIST */

async function loadAdminMemories(){

const box=
document.getElementById(
"adminMemoryList"
);


const snap=
await getDocs(
collection(db,"memories")
);


if(snap.empty){

box.innerHTML=
"<p>কোনো Memory নেই।</p>";

return;

}


box.innerHTML="";


snap.forEach(x=>{

const d=x.data();


box.innerHTML+=`

<div class="memory-card">

<h3>
📍 ${escapeHTML(d.place)}
</h3>

<p>

📅 ${escapeHTML(d.date)}
<br>

👥 ${escapeHTML(d.people)}

</p>


<button
class="delete-btn"
onclick="deleteMemory('${x.id}')">

🗑️ Delete Memory

</button>

</div>

`;

});

}

else{

}

/* HTML SAFE */

function escapeHTML(value){

return String(value||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")
.replaceAll('"',"&quot;")
.replaceAll("'","&#039;");

}


/* START */

const savedProfile=
localStorage.getItem(
"travelProfile"
);


if(savedProfile){

showHomePage();

}
